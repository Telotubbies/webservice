# Tag registry — one file per edge node, loaded via TAGS_CONFIG (default: ./tags.yaml).
#
# Tag naming: {site}.{area}.{line}.{device}.{signal}  (UNS-style; dots map to
# MQTT topic slashes). Only `writable: true` tags accept commands.
#
# `sim:` configures ADAPTER=sim. `modbus:` (commented) is the register-map
# for ADAPTER=modbus — adapter swap = edit this file, no code changes.

sim:
  # These entries mirror CONTRACT.md §Sim tags. The dynamics (speed follows
  # setpoint, temp drifts up, bin fills, gravel random-walks) live in
  # adapters/sim.py — the yaml supplies registry metadata only.
  tags:
    sort.line1.motor1.running:
      writable: true
      initial: false
      behavior: state            # writable value holder
      unit: bool
    sort.line1.motor1.speed_sp:
      writable: true
      initial: 45.0
      min: 0.0                   # writes outside [min,max] -> denied/out_of_range
      max: 60.0
      behavior: state
      unit: Hz
    sort.line1.conv1.speed_mps:
      writable: false
      initial: 0.0
      behavior: conv_speed       # first-order follow of motor1, + noise
      unit: m/s
    sort.line1.conv1.temp_c:
      writable: false
      initial: 28.0
      behavior: conv_temp        # drifts up while running; >80 = alarm territory
      unit: degC
    sort.line1.bin1.level_pct:
      writable: false
      initial: 20.0
      behavior: bin_level        # ramps 0->100 running, decays stopped
      unit: "%"
    sort.vision.cam1.gravel_ratio:
      writable: false
      initial: 0.3
      behavior: random_walk      # slow random walk 0..1 (vision stub)

  # --- Centrale a Beton (concrete batching plant) -- area `batch` ---------------
  # Dynamics live in adapters/batching_sim.py. Writable flags are operator
  # controls; everything else derives from them. `plant.auto.enabled` runs a
  # repeating batch cycle. Real PLC addresses go in the modbus map when wired.
    batch.plant.auto.enabled:
      writable: true
      initial: true
      behavior: state
      unit: bool
    batch.plant.auto.cycle_count:
