# Pytest configuration for the whole suite: which test directories are
# collected, the markers each live-service suite is gated on, and the
# global per-test timeout.
[pytest]
testpaths = contract tenancy integration
markers =
    integration: requires live services (set BASE_URL / MQTT_HOST env vars)
    disruptive: stops/starts compose services — needs DISRUPTIVE=1 and docker
    slow: tests that may take >30s
    db: requires Postgres with the wds roles (set WDS_TEST_APP_DSN / WDS_TEST_SYSTEM_DSN)
    security: live security verification sweep (tests/security — make test-security)
    perf: live performance harness (tests/perf — make test-perf)
timeout = 300
