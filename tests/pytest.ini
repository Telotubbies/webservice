[pytest]
testpaths = contract tenancy integration
markers =
    integration: requires live services (set BASE_URL / MQTT_HOST env vars)
    disruptive: stops/starts compose services — needs DISRUPTIVE=1 and docker
    slow: tests that may take >30s
    db: requires Postgres with the wds roles (set WDS_TEST_APP_DSN / WDS_TEST_SYSTEM_DSN)
timeout = 300
