# Mosquitto 2 + dynamic-security plugin (v4 T6 — doc 17, BINDING).
# Replaces the v1 static passwd + mosquitto.acl files entirely: identities
# and ACLs live in the dynsec JSON (a named volume; the DB is the source of
# truth and the svc-dynsec-admin reconciler syncs it).

# --- TLS listener 8883 (the only listener in the default profile) ---------
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Clients authenticate with username/password inside TLS, not client certs.
require_certificate false
tls_version tlsv1.2

# Extra *.conf dropped in by the test overlay ONLY
# (infra/mosquitto-extras-test/test.conf adds the plaintext :1883 listener —
# doc 20 §3.4: 1883 survives on the test profile only).
include_dir /mosquitto/config-extras

# --- dynamic-security plugin ----------------------------------------------
# plugin_opt_config_file lives on the /mosquitto/data named volume (dynsec
# persists state by atomic rename — a single-file bind mount would fail
# with EBUSY). The container command re-inits the file from the mounted
# svc-dynsec-admin secret when the volume is fresh.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

allow_anonymous false
persistence false
log_type notice
log_type warning
log_type error
# DoS bounds — an MQTT packet can legally be ~256MB; cap it. 8 MiB admits the
# model-test op payload: a 5 MiB image -> ~6.67 MiB base64 + bounded metadata.
max_packet_size 8388608
max_connections 64
max_queued_messages 1000
