listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/mosquitto.acl
persistence false
log_type notice
log_type warning
log_type error
# DoS bounds — an MQTT packet can legally be ~256MB; cap it.
max_packet_size 8192
max_connections 64
max_queued_messages 1000
