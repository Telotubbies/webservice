# Access log without the query string — $request/$request_uri would record
# credentials into logs and proxy traces (the old /ws?token= leak). $uri is
# the path component only.
log_format uri_only '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log uri_only;

  # Security headers — demo serves its own origin + Google Fonts only.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # frame-ancestors 'self' (not 'none'): oidc-client-ts's silent renew loads
  # our own /auth/silent-callback inside a hidden iframe — foreign-origin
  # framing is still fully blocked (v4 T5).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Vite emits content-hashed assets — safe to cache immutably.
  location /assets/ {
    add_header Cache-Control "public, immutable, max-age=31536000";
    try_files $uri =404;
  }

  # Keycloak — same-origin OIDC (v4 T5, ADR-12). The SPA, IdP and API share
  # one origin: iss == <web origin>/realms/wds, no CSP relaxation, and the
  # access token never crosses origins. KC_HOSTNAME must equal this origin.
  location /realms/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Keycloak theme/static assets + admin console (same upstream).
  location /resources/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /admin/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST -> backend (compose service name; override with a different
  # resolver/upstream if deployed elsewhere)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket -> backend
  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # real client IP for the backend's per-IP connection cap (v4 T4)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
