# Access log without the query string — $request/$request_uri would record
# credentials into logs and proxy traces (the old /ws?token= leak). $uri is
# the path component only.
log_format uri_only '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log uri_only;
  # Don't advertise the exact nginx version on every response (v4 T13 —
  # the security suite's header scan asserts the Server token is bare).
  server_tokens off;

  # Security headers are declared PER-LOCATION — only on responses we serve
  # or proxy to the backend. They deliberately do NOT apply to the Keycloak
  # proxy blocks: KC sets its own CSP/X-Frame-Options and our `script-src
  # 'self'` would break KC login-theme inline scripts (WebAuthn/MFA), while
  # a server-level add_header would double-set headers on KC responses
  # (T5 review F6).
  #
  # frame-ancestors 'self' (not 'none'): oidc-client-ts's silent renew loads
  # our own /auth/silent-callback inside a hidden iframe — foreign-origin
  # framing is still fully blocked (v4 T5).

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Vite emits content-hashed assets — safe to cache immutably.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, immutable, max-age=31536000";
    try_files $uri =404;
  }

  # Keycloak — same-origin OIDC (v4 T5, ADR-12). The SPA, IdP and API share
  # one origin: iss == <web origin>/realms/wds, no CSP relaxation, and the
  # access token never crosses origins. KC_HOSTNAME must equal this origin.
  #
  # Only the `wds` realm is exposed on the public web origin — the admin
  # console (/admin/) and the master realm (/realms/master/) are NOT proxied
  # here (T5 review F1); they stay reachable only on KC's loopback port 8080.
  # KC's own response headers pass through untouched (see header note above).
  location /realms/wds/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Keycloak theme/static assets used by the wds login UI (same upstream;
  # admin-console static assets also live here but the admin app itself is
  # not reachable — /admin/ is not proxied).
  location /resources/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST -> backend (compose service name; override with a different
  # resolver/upstream if deployed elsewhere)
  location /api/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket -> backend
  location /ws {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # real client IP for the backend's per-IP connection cap (v4 T4) —
    # trusted only because backend TRUSTED_PROXIES names this container's
    # pinned docker-network address (T5 review F10)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Ops endpoints are backend-only (loopback :8000, v4 T8; CONTRACT.v2:48 —
  # /readyz must never ride the public web origin). Without this block the
  # SPA fallback below would answer them with index.html, which is worse
  # than a clean 404: a probe reads "200 + HTML" as healthy. Regex +
  # case-insensitive so /metrics/, /METRICS, /readyz/x can't slip through
  # (FastAPI's own paths are lowercase, but probes aren't).
  location ~* ^/(metrics|readyz|healthz|docs|redoc|openapi\.json)(/.*)?$ {
    # Security headers here too (v4 T13): this block returns nginx's own 404,
    # which otherwise ships header-less — every response class carries them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    return 404;
  }

  # SPA fallback
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
