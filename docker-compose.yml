# Bounded container logs — docker json-file driver is unbounded by default
# and will eventually fill the host disk (demo boxes too).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-pg-env: &pg-dsns
  WDS_APP_DSN: "postgresql://wds_app:${WDS_APP_PASSWORD:-app-dev-pass}@postgres:5432/wds"
  WDS_SYSTEM_DSN: "postgresql://wds_system:${WDS_SYSTEM_PASSWORD:-system-dev-pass}@postgres:5432/wds"

services:
  postgres:
    image: postgres:16-alpine
    # No host port: only the compose network can reach the DB (ADR-13 §6).
    # docker-compose.test.yml publishes it on 127.0.0.1 for the DB test suite.
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-pass}"
      WDS_OWNER_PASSWORD: "${WDS_OWNER_PASSWORD:-owner-dev-pass}"
      WDS_APP_PASSWORD: "${WDS_APP_PASSWORD:-app-dev-pass}"
      WDS_SYSTEM_PASSWORD: "${WDS_SYSTEM_PASSWORD:-system-dev-pass}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "wds"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # One-shot: Alembic as wds_owner. The backend only starts after it succeeds,
  # and never holds owner credentials itself (ADR-13 §1).
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      WDS_MIGRATE_DSN: "postgresql+psycopg://wds_owner:${WDS_OWNER_PASSWORD:-owner-dev-pass}@postgres:5432/wds"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # localhost-only TLS listener (v4 T6, doc 17 §2). The plaintext 1883
      # listener exists ONLY under the test profile (docker-compose.test.yml
      # mounts infra/mosquitto-extras-test over config-extras).
      - "127.0.0.1:8883:8883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/certs:/mosquitto/certs:ro
      - ./infra/mosquitto-extras:/mosquitto/config-extras:ro
      - mosquitto-data:/mosquitto/data
    secrets:
      - svc_dynsec_admin_pw
    entrypoint: ["/docker-entrypoint.sh"]
    command:
      - /bin/sh
      - -c
      - |
        set -e
        # First boot only: seed the dynsec store with svc-dynsec-admin —
        # the ONLY $CONTROL identity (doc 17 §2). The named volume persists
        # the file; the DB is the source of truth for everything else.
        if [ ! -s /mosquitto/data/dynamic-security.json ]; then
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json \
            svc-dynsec-admin "$$(cat /run/secrets/svc_dynsec_admin_pw)"
          # init runs as root (before mosquitto drops to user mosquitto) —
          # the plugin must be able to read the file it just wrote.
          chown mosquitto:mosquitto /mosquitto/data/dynamic-security.json
          chmod 640 /mosquitto/data/dynamic-security.json
        fi
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      # dynsec admin round-trip proves listener + plugin are live. The
      # password is read from a mounted secret — `docker inspect` shows the
      # command text only, never the secret (v4 T6).
      test: ["CMD-SHELL", "mosquitto_ctrl -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -u svc-dynsec-admin -P \"$$(cat /run/secrets/svc_dynsec_admin_pw)\" dynsec getDefaultACLAccess >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # OIDC provider (v4 T5, ADR-12). Realm `wds` is imported at startup from
  # infra/keycloak/realm-wds.json — no credentials live in the artifact;
  # `make seed-dev` sets the demo user passwords + org memberships.
  # KC_HOSTNAME is the WEB origin (nginx proxies ONLY /realms/wds/ +
  # /resources/ to this service — admin console + master realm stay on this
  # loopback port, T5 review F1) so issuer == browser authority ==
  # backend's expected iss — the same URL on every hop.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:-admin-dev-pass}"
      KC_HOSTNAME: "${KC_HOSTNAME:-http://localhost:5173}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      # loopback only — browsers reach it through the web proxy
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  edge-bridge:
    build: ./edge-bridge
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /mosquitto-certs/ca.crt
      # Provisioned identity (doc 17 §2): edge-{edge_uuid}-v{n} + a secret
      # that exists ONLY in the mounted file — no shared creds, nothing in
      # docker inspect. The bridge re-reads the file each reconnect so a
      # rotated credential takes over at cut-over (doc 17 §5).
      MQTT_USERNAME_FILE: /run/secrets/edge_bootstrap_user
      MQTT_PASSWORD_FILE: /run/secrets/edge_bootstrap_pw
      ORG_ID: "${V1_ORG_ID:-0199d000-0000-7000-8000-00000000a001}"
      SITE_ID: "${V1_SITE_ID:-0199d000-0000-7000-8000-00000000b001}"
      EDGE_ID: "${V1_EDGE_ID:-0199d000-0000-7000-8000-00000000c001}"
      SITE: plant1              # tag-naming site code, not a topic identity
      ADAPTER: sim
      POLL_MS: "1000"
      EDGE_CLOCK_SKEW_MS: "${EDGE_CLOCK_SKEW_MS:-0}"
    volumes:
      - ./infra/certs:/mosquitto-certs:ro
    secrets:
      - edge_bootstrap_user
      - edge_bootstrap_pw
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /mosquitto-certs/ca.crt
      # doc 17 §2 — svc-backend is a dynsec client minted by the reconciler;
      # its secret lives only in the mounted file (docker inspect clean).
      MQTT_USER: svc-backend
      MQTT_PASSWORD_FILE: /run/secrets/svc_backend_pw
      # svc-dynsec-admin reconciler channel + provisioning secrets
      DYNSEC_ADMIN_PASSWORD_FILE: /run/secrets/svc_dynsec_admin_pw
      SVC_BACKEND_PW_FILE: /run/secrets/svc_backend_pw
      EDGE_BOOTSTRAP_PW_FILE: /run/secrets/edge_bootstrap_pw
      SITE: plant1
      <<: *pg-dsns
      APP_ENV: "${APP_ENV:-dev}"
      CORS_ORIGIN: http://localhost:5173
      # v4 T4 — rate limiting + WS origin check (backend/app/config.py).
      # ALLOWED_ORIGINS empty = same-origin only (Origin host must match Host).
      RATE_COMMANDS_PER_TAG: "${RATE_COMMANDS_PER_TAG:-5}"
      RATE_MUTATIONS_PER_USER: "${RATE_MUTATIONS_PER_USER:-60}"
      RATE_WS_PER_IP: "${RATE_WS_PER_IP:-20}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      TAGS_CONFIG: /config/tags.yaml
      ALARM_RULES_CONFIG: /config/alarm_rules.yaml
      # v4 T5 — OIDC (ADR-12). iss is the public web origin (nginx proxies
      # the realm); JWKS is fetched on the compose network. Dev tokens only
      # resolve when APP_ENV=dev.
      OIDC_ISSUER: "${OIDC_ISSUER:-http://localhost:5173/realms/wds}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-wds-api}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-wds-web}"
      OIDC_JWKS_URI: "${OIDC_JWKS_URI:-http://keycloak:8080/realms/wds/protocol/openid-connect/certs}"
      # T5 review F10 — X-Real-IP is trusted ONLY from loopback or these
      # CIDRs. The default network is pinned (below) and `web` has a fixed
      # address, so only the nginx container can claim client IPs — other
      # docker-network peers can't spoof the /ws per-IP cap bucket.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.30.10.10/32}"
      # seed_oidc (`make seed-dev`) — KC admin + demo-user password from env
      KC_INTERNAL_URL: "http://keycloak:8080"
      KC_ADMIN: "${KC_ADMIN:-admin}"
      KC_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:-admin-dev-pass}"
      KC_DEMO_PASSWORD: "${KC_DEMO_PASSWORD:-kc-demo-pass}"
    volumes:
      # Tag registry + alarm thresholds are operator-editable config, not
      # image content — single source for backend + edge-bridge.
      - ./edge-bridge/tags.yaml:/config/tags.yaml:ro
      - ./backend/alarm_rules.yaml:/config/alarm_rules.yaml:ro
      # Dev CA for the TLS listener (infra/gen-certs.sh — `make certs`).
      - ./infra/certs:/mosquitto-certs:ro
    secrets:
      - svc_backend_pw
      - svc_dynsec_admin_pw
      - edge_bootstrap_pw
    depends_on:
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:80"
    networks:
      default:
        # pinned so backend TRUSTED_PROXIES can name exactly this container
        # (T5 review F10)
        ipv4_address: 172.30.10.10
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        # nginx resolves the /realms/ upstream at startup — must exist
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  # Dynsec plugin state — a CACHE of Postgres, not a source of truth
  # (doc 17 §6). `docker compose down -v` + restart rebuilds it.
  mosquitto-data:
  # Legacy v1 SQLite volume — kept read-only-in-spirit as the migration source
  # and rollback path (doc 18 §3). Nothing mounts it read-write any more.
  backend-data:

# MQTT identity secrets (infra/gen-secrets.sh — `make secrets`). Mounted at
# /run/secrets/<name>; never in environment, never in `docker inspect`.
secrets:
  svc_dynsec_admin_pw:
    file: ./infra/secrets/svc_dynsec_admin_pw
  svc_backend_pw:
    file: ./infra/secrets/svc_backend_pw
  edge_bootstrap_user:
    file: ./infra/secrets/edge_bootstrap_user
  edge_bootstrap_pw:
    file: ./infra/secrets/edge_bootstrap_pw

# Pinned subnet (unused-by-default range) so `web`'s fixed address above is
# deterministic — backend TRUSTED_PROXIES names it for X-Real-IP trust
# (T5 review F10).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.10.0/24
